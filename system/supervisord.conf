[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
pidfile=/tmp/supervisord.pid
minfds=1024
minprocs=200
nodaemon=true

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Default single-container layout: run everything (core + classification).
# Include paths are absolute so they resolve whether this file is the baked
# /etc/supervisord.conf (prd) or the dev bind-mount at /etc/supervisord.conf,
# because system/ is always present at /srv/system in both layouts.
[include]
files = /srv/system/conf/programs-core.conf /srv/system/conf/programs-classification.conf
