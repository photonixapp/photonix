[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
pidfile=/tmp/supervisord.pid
minfds=1024
minprocs=200
nodaemon=true

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Low-memory layout, used when LOW_MEMORY=1: core services plus one single-process
# classifier that keeps at most one model loaded.
[include]
files = /srv/system/conf/programs-core.conf /srv/system/conf/programs-classification-lowmem.conf
