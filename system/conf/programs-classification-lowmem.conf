[program:classification_processor]
autorestart=true
startretries=10
command=nice -n 19 python /srv/photonix/manage.py classification_processor
startsecs=2
environment=PYTHONPATH=/srv
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
stderr_logfile_maxbytes=0
stdout_logfile_maxbytes=0

[program:retrain_face_similarity_index]
autorestart=true
startretries=10
command=bash -c "sleep 30 && while true; do python /srv/photonix/manage.py retrain_face_similarity_index; sleep 300; done"
startsecs=30
environment=PYTHONPATH=/srv
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
stderr_logfile_maxbytes=0
stdout_logfile_maxbytes=0
