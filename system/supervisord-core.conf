[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
pidfile=/tmp/supervisord.pid
minfds=1024
minprocs=200
nodaemon=true

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Core-only layout: everything except the ML classification processors.
# Used when CLASSIFICATION_DISABLED=1 so a separate photonix-ml container
# (running supervisord-ml.conf) owns the classification Task queue instead.
[include]
files = /srv/system/conf/programs-core.conf
