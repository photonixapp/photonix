[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
pidfile=/tmp/supervisord.pid
minfds=1024
minprocs=200
nodaemon=true

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ML-only layout: just the classification scheduler, the classifier
# processors and the similarity-index retrain loops. Run by the optional
# photonix-ml sidecar container against the shared Postgres/Redis and the
# shared /data volumes. No nginx/app_server/vite here - the core container
# owns the web tier and the photo import/thumbnail/raw pipeline.
[include]
files = /srv/system/conf/programs-classification.conf
